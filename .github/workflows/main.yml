name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix layout
        run: |
          J=src/main/java/dev/pulse/extra
          mkdir -p $J/mixin src/main/resources
          mv ClickGui.java Mods.java PulseExtra.java $J/
          mv *Mixin.java $J/mixin/
          mv fabric.mod.json pulseextra.mixins.json src/main/resources/
          find src -type f

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - run: gradle build

      - run: ls -la build/libs

      - uses: actions/upload-artifact@v4
        with:
          name: pulseextra-jar
          path: build/libs/*.jar
